          url-query: .urls[] | select(.filename | endswith("none-any.whl")) | .url
  - name: python-pillow
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-build-isolation --prefix=${FLATPAK_DEST} .
    sources:
      - type: git
        url: https://github.com/python-pillow/Pillow.git
        tag: 12.3.0
        commit: bb1d8e8ab8d29048624d96e3ee53cecf7c13d13d
