app-id: tv.kodi.Kodi
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk17
command: kodi
rename-icon: kodi
rename-desktop-file: kodi.desktop
desktop-file-name-suffix: ' (Beta)'

finish-args:
  - --device=all
  - --allow=bluetooth
  - --filesystem=xdg-music
  - --filesystem=xdg-pictures
  - --filesystem=xdg-videos
  - --filesystem=xdg-run/pipewire-0:ro
  - --filesystem=/mnt
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=/run/lirc
  - --filesystem=/run/udev:ro
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=fallback-x11
  - --socket=wayland
  - --system-talk-name=org.freedesktop.Avahi
  - --system-talk-name=org.freedesktop.login1
  - --system-talk-name=org.freedesktop.UDisks2
  - --system-talk-name=org.freedesktop.UPower
  - --talk-name=org.freedesktop.ScreenSaver

cleanup:
  - '*.a'
  - '*.la'
  - '*.pyc'
  - '*.pyo'
  - '*.cmake'
  - /.ref
  - /etc
  - /include
  - /lib/cmake
  - /lib64/cmake
  - /lib/pkgconfig
  - /lib/*.so
  - /lib64/pkgconfig
  - /man
  - /private
  - /share/aclocal
  - /share/doc
  - /share/info
  - /share/locale
  - /share/man
  - /var
modules:
  - name: avahi
    cleanup:
      - /bin
      - /share/runtime/locale
    config-opts:
      - --enable-shared
      - --disable-static
      - --with-distro=none
      - --disable-libdaemon
      - --disable-libsystemd
      - --disable-nls
      - --disable-core-docs
      - --disable-manpages
      - --disable-mono
      - --disable-libevent
      - --disable-qt4
      - --disable-qt5
      - --disable-python
      - --disable-gtk
      - --disable-gtk3
      - --enable-compat-libdns_sd
    sources:
      - type: archive
        url: https://github.com/avahi/avahi/archive/refs/tags/v0.9-rc5.tar.gz
        sha256: 5b0a9d88110b0fc8aaafc5cc0a26e83e7d2a4aca3a36bc27c9b626db7ead27b0
        x-checker-data:
          type: anitya
          project-id: 147
          url-template: https://github.com/avahi/avahi/archive/refs/tags/v$version.tar.gz
          stable-only: false
  - name: dav1d
    buildsystem: meson
    config-opts:
      - -Ddefault_library=shared
      - -Denable_asm=true
      - -Denable_tools=false
      - -Denable_examples=false
      - -Denable_tests=false
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://code.videolan.org/videolan/dav1d/-/archive/1.5.4/dav1d-1.5.4.tar.bz2
        sha512: 1e4dbc409ce77c61c5e4a4f8d6855c35cabf3da5dd6456beccb4c13d0fa58a50045d8ce5bb6832516fe860e6d27303b7b6b8404b330581e122513d39d524dbcc
        x-checker-data:
          type: anitya
          project-id: 18920
          url-template: https://code.videolan.org/videolan/dav1d/-/archive/$version/dav1d-$version.tar.bz2
  - name: ffmpeg
    config-opts:
      - --enable-shared
      - --disable-static
      - --enable-libdav1d
      - --enable-gpl
      - --enable-gnutls
      - --enable-libdrm
      - --enable-hwaccels
      - --disable-doc
    build-options:
      arch:
        x86_64:
          config-opts:
            - --enable-vaapi
        aarch64:
          config-opts:
            - --enable-v4l2_m2m
            - --enable-v4l2-request
            - --enable-libudev
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n9.0.1.tar.gz
        sha512: 41aa687cec4e93d0ffde21ea96faa48e4344fda0e9d2c9c71adfb68fedadf03beb274ec712eb1e082bf64fdcee87c55a47bb5c78d5193934be3f3f06e5e792b2
        x-checker-data:
          type: anitya
          project-id: 5405
          url-template: https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n$version.tar.gz
      - type: file
        url: https://raw.githubusercontent.com/xbmc/xbmc/bc56c2fcd679a9bbb8c9d13b505a6c7285f7206c/tools/depends/target/ffmpeg/001-ffmpeg-all-libpostproc-plugin.patch
        sha256: 019ab331eac814e4995c65dcc8076cc433a64bb4a5d2aa6aef5516922dd691e6
        dest-filename: 001-ffmpeg-all-libpostproc-plugin.patch
      - type: shell
        commands:
          - patch -p1 < 001-ffmpeg-all-libpostproc-plugin.patch
      # v4l2-request hwaccel (from LibreELEC) targets stateless decoders found on aarch64 SoCs; x86_64 uses VAAPI
      - type: file
        url: https://raw.githubusercontent.com/LibreELEC/LibreELEC.tv/e9e6b8531df13bc9058ca1771dab5f0c4fd5e98e/packages/multimedia/ffmpeg/patches/v4l2-request/0001-v4l2-request.patch
        sha256: afd04c202c27081c355d8d34b58a52c4141de26433007e27ed6e0d2093d10d3c
        dest-filename: 0001-v4l2-request.patch
        only-arches:
          - aarch64
      - type: shell
        only-arches:
          - aarch64
        commands:
          - patch -p1 < 0001-v4l2-request.patch
  - name: flatbuffers
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DFLATBUFFERS_BUILD_FLATLIB=OFF
      - -DFLATBUFFERS_BUILD_SHAREDLIB=ON
      - -DCMAKE_INSTALL_LIBDIR=lib
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://github.com/google/flatbuffers/archive/refs/tags/v25.12.19-2026-02-06-03fffb2.tar.gz
        sha512: 61d71f830a249d16e5d9e3d7ffde40b123bddc3824c3431aeedc3c19eb9913ca5c6ae4d509a65824242b50b363037cd9d5b084170e4719d8b24762c13be054c4
        x-checker-data:
          type: anitya
          project-id: 16642
          url-template: https://github.com/google/flatbuffers/archive/refs/tags/v$version.tar.gz
      - type: shell
        commands:
          - sed -i 's/-Werror=/-W/g;s/-Werror//g' CMakeLists.txt
  - name: fstrcmp
    buildsystem: autotools
    config-opts:
      - --enable-shared
      - --disable-static
    make-args:
      - all-bin
    install-rule: install-libdir
    make-install-args:
      - install-include
    sources:
      - type: archive
        url: http://fstrcmp.sourceforge.net/fstrcmp-0.7.D001.tar.gz
        sha512: aaeb0227afd5ada5955cbe6a565254ff88d2028d677d199c00e03b7cb5de1f2c69b18e6e8b032e452350a8eda7081807b01765adbeb8476eaf803d9de6e5509c
        x-checker-data:
          type: anitya
          project-id: 7320
          url-template: http://fstrcmp.sourceforge.net/fstrcmp-$version.tar.gz
  - name: glm
    buildsystem: cmake-ninja
    config-opts:
      - -DGLM_BUILD_TESTS=OFF
    sources:
      - type: archive
        url: https://github.com/g-truc/glm/archive/refs/tags/1.0.3.tar.gz
        sha256: 6775e47231a446fd086d660ecc18bcd076531cfedd912fbd66e576b118607001
        x-checker-data:
          type: anitya
          project-id: 1181
          url-template: https://github.com/g-truc/glm/archive/refs/tags/$version.tar.gz
      - type: shell
        commands:
          - echo 'install(FILES ${ROOT_HEADER} ${ROOT_INLINE} DESTINATION include/glm)'
            >> glm/CMakeLists.txt
          - echo 'install(FILES ${CORE_HEADER} ${CORE_INLINE} DESTINATION include/glm/detail)'
            >> glm/CMakeLists.txt
          - echo 'install(FILES ${EXT_HEADER} ${EXT_INLINE} DESTINATION include/glm/ext)'
            >> glm/CMakeLists.txt
          - echo 'install(FILES ${GTC_HEADER} ${GTC_INLINE} DESTINATION include/glm/gtc)'
            >> glm/CMakeLists.txt
          - echo 'install(FILES ${GTX_HEADER} ${GTX_INLINE} DESTINATION include/glm/gtx)'
            >> glm/CMakeLists.txt
          - echo 'install(FILES ${SIMD_HEADER} ${SIMD_INLINE} DESTINATION include/glm/simd)'
            >> glm/CMakeLists.txt
          - echo 'install(TARGETS glm)' >> glm/CMakeLists.txt
  - name: hwdata
    config-opts:
      - --datarootdir=${FLATPAK_DEST}/lib/
    sources:
      - type: archive
